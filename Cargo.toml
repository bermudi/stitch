[package]
name = "stitch"
version = "0.10.0"
edition = "2024"
description = "A dotfile manager that symlinks your configs into place"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
serde_json = "1"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
walkdir = "2"
globset = "0.4"
dirs = "6"
thiserror = "2"
minijinja = "2.21.0"
libc = "0.2.189"
